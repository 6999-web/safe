server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: whitehat-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/whitehat}
    username: ${DB_USER:whitehat}
    password: ${DB_PASSWORD:whitehat}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    enabled: true
    locations: classpath:db/migration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
security:
  jwt:
    secret: ${JWT_SECRET:development-secret-change-this-before-production}
    expiration-minutes: 480
storage:
  upload-dir: ${UPLOAD_DIR:./uploads}
integration:
  ctfd-url: ${CTFD_URL:http://ctfd:8000}
  taiga-url: ${TAIGA_URL:http://taiga:9000}
  flarum-url: ${FLARUM_URL:http://flarum}
  defectdojo-url: ${DEFECTDOJO_URL:http://defectdojo:8080}

